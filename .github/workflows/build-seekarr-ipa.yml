name: Build Seekarr IPA

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Get latest upstream release tag
        id: latest
        run: |
          TAG=$(gh release view --repo matthw-labs/seekarr --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Seekarr release
        uses: actions/checkout@v4
        with:
          repository: matthw-labs/seekarr
          ref: ${{ steps.latest.outputs.tag }}

      - name: Patch missing iOS app icon set
        run: |
          cp -R ios/Runner/Assets.xcassets/AppIcon.appiconset \
            ios/Runner/Assets.xcassets/seekarr_icon.appiconset

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Seekarr-${{ steps.latest.outputs.tag }}-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Seekarr-${{ steps.latest.outputs.tag }}-unsigned-ipa
          path: Seekarr-${{ steps.latest.outputs.tag }}-unsigned.ipa
